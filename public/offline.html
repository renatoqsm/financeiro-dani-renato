<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0c3932" />
    <title>Casa em dia · Sem conexão</title>
    <style>
      body {
        font: 16px system-ui;
        background: #f6f8f6;
        color: #243a33;
        display: grid;
        place-items: center;
        min-height: 90vh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 400px;
      }
      h1 {
        font-size: 28px;
      }
      p {
        line-height: 1.7;
      }
      a {
        display: inline-block;
        background: #1e6754;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        padding: 14px 20px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vamos reconectar a casa?</h1>
      <p>
        Você está sem conexão. Conecte o celular à internet para acessar os
        dados atualizados e registrar alterações.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
